name: Build A05s Camera Boost

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" -print -quit)
          mkdir build-project
          unzip -q "$ZIP" -d build-project

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Fix Compose compiler configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("build-project/build.gradle.kts")
          app = Path("build-project/app/build.gradle.kts")

          root_text = root.read_text()

          if 'org.jetbrains.kotlin.plugin.compose' not in root_text:
              root_text = root_text.replace(
                  'id("org.jetbrains.kotlin.android") version "2.0.21" apply false',
                  'id("org.jetbrains.kotlin.android") version "2.0.21" apply false\n    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false'
              )
              root.write_text(root_text)

          app_text = app.read_text()

          if 'org.jetbrains.kotlin.plugin.compose' not in app_text:
              app_text = app_text.replace(
                  'id("org.jetbrains.kotlin.android")',
                  'id("org.jetbrains.kotlin.android")\n    id("org.jetbrains.kotlin.plugin.compose")'
              )
              app.write_text(app_text)

          print("Compose compiler plugin configured.")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          gradle -p build-project assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: A05s-Camera-Boost-APK
          path: build-project/app/build/outputs/apk/debug/app-debug.apk
